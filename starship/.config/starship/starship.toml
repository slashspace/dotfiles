# Prompt shape from linkarzu's active Starship config.
# Colors are linkarzu-colors. The private logo glyph is omitted.
format = """
$username\
$hostname\
$time\
$directory\
$git_branch\
$git_status\
$character
"""

[character]
success_symbol = '[❯❯❯❯](bold #37f499)'
error_symbol = '[XXXX](bold #f16c75)'
vicmd_symbol = '[❮❮❮❮](bold #fca6ff)'

[battery]
disabled = true

[gcloud]
disabled = true

[time]
style = 'bold #987afb'
disabled = false
format = '\[[$time]($style)\] '
time_format = '%y/%m/%d'

[kubernetes]
disabled = true

[username]
style_user = 'bold #987afb'
style_root = 'bold white'
format = '[$user]($style).@.'
show_always = true

[hostname]
ssh_only = true
format = '[$hostname](bold #37f499)'

[directory]
style = 'bold #04d1f9'
truncation_length = 0
truncate_to_repo = false
format = '[$path]($style) '

[git_branch]
style = 'bold #f1fc79'
format = '[$symbol$branch]($style) '

[git_status]
style = 'bold #f16c75'
format = '([$all_status$ahead_behind]($style))'

[ruby]
detect_variables = []
detect_files = ['Gemfile', '.ruby-version']
